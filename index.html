<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NIGHTWAVE DRIVE</title>
<style>
  :root{ --bg:#0b0121; --hud-a:#ff71d5; --hud-b:#9ffcff; }
  html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);height:100%;font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
  #c{display:block;width:100%;height:100%;}
  /* ---- CRT scanlines + vignette ---- */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, transparent 1px, transparent 3px);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(10,0,30,.55) 100%);}
  /* ---- HUD ---- */
  #hud{position:fixed;top:18px;left:22px;z-index:10;pointer-events:none;}
  #speed{font-size:34px;font-weight:800;font-style:italic;letter-spacing:2px;
    background:linear-gradient(180deg,var(--hud-b) 20%,var(--hud-a) 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(255,80,200,.45));}
  #speed small{font-size:14px;letter-spacing:4px;}
  #offroad{font-size:13px;letter-spacing:6px;color:var(--hud-a);font-weight:700;margin-top:2px;
    opacity:0;transition:opacity .2s;text-shadow:0 0 10px var(--hud-a);}
  /* one flex row, so button widths can never collide however long the labels get */
  #topBar{position:fixed;top:16px;right:18px;z-index:30;display:flex;gap:10px;align-items:flex-start;}
  #topBar button{font-family:inherit;white-space:nowrap;background:rgba(20,4,50,.55);
    border:1px solid var(--hud-a);color:var(--hud-b);border-radius:8px;
    padding:8px 14px;font-size:14px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(4px);}
  #topBar button:hover{border-color:var(--hud-b);}
  /* ---- theme queue menu ---- */
  #menu{position:fixed;top:58px;right:18px;z-index:30;width:340px;max-height:82vh;overflow-y:auto;
    background:rgba(10,3,32,.94);border:1px solid var(--hud-a);border-radius:12px;padding:14px;
    color:#dce9ff;font-size:12px;letter-spacing:.5px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.55);}
  #menu .mhead{display:flex;justify-content:space-between;align-items:center;}
  #menu h3{margin:0;font-size:13px;letter-spacing:3px;color:var(--hud-b);}
  #menu button{font-family:inherit;background:rgba(255,255,255,.06);color:#dce9ff;
    border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:5px 9px;cursor:pointer;letter-spacing:1px;font-size:11px;}
  #menu button:hover{border-color:var(--hud-b);}
  #menu .x{border:none;background:none;font-size:15px;padding:2px 6px;}
  #nowPlaying{margin:8px 0 10px;padding:7px 9px;border-radius:6px;background:rgba(255,255,255,.05);font-size:11px;color:var(--hud-b);}
  #nowPlaying .bar{height:3px;margin-top:6px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
  #nowPlaying .bar i{display:block;height:100%;width:0;background:var(--hud-a);transition:width .2s linear;}
  .qrow{display:flex;align-items:center;gap:4px;margin-bottom:5px;}
  .qrow select{flex:1;min-width:0;font-family:inherit;font-size:11px;background:#170a38;color:#dce9ff;
    border:1px solid rgba(255,255,255,.22);border-radius:5px;padding:4px;}
  .qrow input{width:32px;font-family:inherit;font-size:11px;text-align:center;background:#170a38;color:#dce9ff;
    border:1px solid rgba(255,255,255,.22);border-radius:5px;padding:4px 1px;}
  .qrow .mini{padding:4px 5px;line-height:1;}
  .mrow{display:flex;gap:6px;align-items:center;margin:10px 0 4px;flex-wrap:wrap;}
  .mrow label{display:flex;align-items:center;gap:4px;cursor:pointer;}
  .msub{margin:13px 0 7px;letter-spacing:3px;color:var(--hud-b);font-size:10px;}
  #paletteGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .chip{display:flex!important;align-items:center;gap:7px;padding:6px!important;text-align:left;}
  .chip .sw{display:flex;border-radius:3px;overflow:hidden;flex:0 0 auto;box-shadow:0 0 6px rgba(0,0,0,.4);}
  .chip .sw i{width:8px;height:15px;display:block;}
  .chip.locked{opacity:.42;cursor:default;}
  /* ---- futuristic phone ---- */
  #phone{position:fixed;right:20px;bottom:20px;z-index:32;width:322px;height:min(628px,80vh);
    transform:translateY(118%) scale(.96);opacity:0;pointer-events:none;
    transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .3s;}
  #phone.open{transform:none;opacity:1;pointer-events:auto;}
  .pBody{height:100%;display:flex;flex-direction:column;border-radius:30px;overflow:hidden;
    background:linear-gradient(165deg,rgba(24,10,52,.95),rgba(7,3,20,.97));
    border:1px solid var(--hud-a);
    box-shadow:0 0 44px rgba(0,0,0,.65), 0 0 26px -8px var(--hud-a), inset 0 1px 0 rgba(255,255,255,.14);
    color:#dce9ff;font-size:12px;letter-spacing:.4px;backdrop-filter:blur(10px);}
  .pNotch{width:88px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:11px auto 0;flex:0 0 auto;}
  .pStatus{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 4px;
    font-size:9px;letter-spacing:2px;color:var(--hud-b);opacity:.8;flex:0 0 auto;}
  .pCredits{padding:6px 20px 12px;flex:0 0 auto;}
  .pCredits small{display:block;font-size:9px;letter-spacing:3px;opacity:.55;}
  .pCredits b{display:block;font-size:31px;font-weight:800;font-style:italic;line-height:1.12;
    background:linear-gradient(180deg,var(--hud-b),var(--hud-a));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .pCredits em{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--hud-b);opacity:.8;}
  .pTabs{display:flex;gap:5px;padding:0 14px 10px;flex:0 0 auto;}
  .pTabs button{flex:1;font-family:inherit;font-size:9px;letter-spacing:1px;padding:7px 0;cursor:pointer;
    background:rgba(255,255,255,.05);color:#dce9ff;border:1px solid rgba(255,255,255,.16);border-radius:8px;}
  .pTabs button.on{background:var(--hud-a);border-color:var(--hud-a);color:#0a0418;font-weight:700;}
  .pScreen{flex:1;overflow-y:auto;padding:2px 14px 16px;}
  .pScreen::-webkit-scrollbar{width:4px;}
  .pScreen::-webkit-scrollbar-thumb{background:var(--hud-a);border-radius:2px;}
  .pRow{display:flex;align-items:center;gap:9px;padding:9px 10px;margin-bottom:7px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    border-left:2px solid var(--hud-a);}
  .pRow.max{opacity:.5;border-left-color:rgba(255,255,255,.3);}
  .pIcon{font-size:17px;width:24px;text-align:center;flex:0 0 auto;filter:drop-shadow(0 0 5px var(--hud-a));}
  .pInfo{flex:1;min-width:0;}
  .pInfo b{display:block;font-size:11.5px;letter-spacing:.6px;}
  .pInfo span{display:block;font-size:9.5px;opacity:.6;line-height:1.35;margin-top:1px;}
  .pInfo i{font-style:normal;font-size:9px;letter-spacing:1.4px;color:var(--hud-b);}
  .pBuy{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.5px;padding:7px 9px;min-width:56px;
    cursor:pointer;border-radius:8px;border:1px solid var(--hud-b);color:var(--hud-b);
    background:rgba(255,255,255,.06);flex:0 0 auto;}
  .pBuy.no{opacity:.32;cursor:default;border-color:rgba(255,255,255,.25);color:#dce9ff;}
  .pBuy:not(.no):hover{background:var(--hud-b);color:#0a0418;}
  .tSw{display:flex;border-radius:3px;overflow:hidden;width:fit-content;margin:4px 0 3px;}
  .tSw i{width:17px;height:11px;display:block;}
  .tR0{color:#9fb0c8}.tR1{color:#5ec8ff}.tR2{color:#d38bff}.tR3{color:#ffcf4a}.tR4{color:#ffcb05}
  .pCode{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.16);}
  .pCode small{display:block;font-size:9px;letter-spacing:3px;opacity:.55;margin-bottom:7px;}
  .pCode>div{display:flex;gap:6px;}
  .pCode input{flex:1;min-width:0;font-family:inherit;font-size:11px;letter-spacing:1.5px;
    background:#170a38;color:#dce9ff;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 10px;}
  .pCode input:focus{outline:none;border-color:var(--hud-b);}
  .pCode button{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:1px;padding:8px 15px;
    cursor:pointer;border-radius:8px;border:1px solid var(--hud-b);color:var(--hud-b);background:rgba(255,255,255,.06);}
  .pCode button:hover{background:var(--hud-b);color:#0a0418;}
  .pRow.owned{border-left-color:var(--hud-b);}
  .pStat{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.07);}
  .pStat span:last-child{color:var(--hud-b);}
  #toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:33;pointer-events:none;
    background:rgba(10,3,32,.9);border:1px solid var(--hud-a);border-radius:10px;padding:10px 18px;
    color:var(--hud-b);font-size:12px;letter-spacing:2px;opacity:0;transition:opacity .5s;}
  #toast.on{opacity:1;}
  #money{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--hud-b);margin-top:6px;
    text-shadow:0 0 10px var(--hud-a);}
  #fare{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--hud-b);
    text-shadow:0 0 10px var(--hud-a);opacity:0;transition:opacity .3s;}
  #boost{display:flex;align-items:center;gap:8px;margin-top:7px;}
  #boost span{font-size:9px;letter-spacing:3px;color:var(--hud-b);opacity:.72;}
  #boostBar{width:132px;height:7px;border-radius:4px;overflow:hidden;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);}
  #boostFill{display:block;height:100%;width:100%;background:var(--hud-b);box-shadow:0 0 9px var(--hud-b);}
  #boost.low #boostFill{background:var(--hud-a);box-shadow:0 0 9px var(--hud-a);}
  #boost.lock{animation:bpulse .7s infinite;}
  @keyframes bpulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* ---- Title overlay ---- */
  #title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;cursor:pointer;
    background:radial-gradient(ellipse at 50% 60%, rgba(30,0,70,.25), rgba(8,0,25,.78));
    transition:opacity 1.2s;}
  #title.gone{opacity:0;pointer-events:none;}
  #title h1{margin:0;font-size:clamp(44px,9vw,110px);font-weight:900;font-style:italic;
    letter-spacing:6px;line-height:.95;text-align:center;
    background:linear-gradient(180deg,#fff8b0 0%,#ffb0e8 38%,#ff4fc3 52%,#4de3ff 55%,#c2f7ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,80,200,.55)) drop-shadow(0 3px 0 rgba(60,0,90,.9));}
  #title .jp{font-size:clamp(15px,2.4vw,24px);letter-spacing:14px;color:#8fe9ff;
    text-shadow:0 0 14px rgba(80,220,255,.8);}
  #title .press{margin-top:26px;font-size:clamp(13px,2vw,18px);letter-spacing:8px;color:#ffd7f4;
    animation:blink 1.4s infinite;text-shadow:0 0 12px rgba(255,120,220,.8);}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
  #hint{position:fixed;bottom:16px;width:100%;text-align:center;z-index:10;pointer-events:none;
    font-size:12px;letter-spacing:4px;color:rgba(180,240,255,.55);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crt"></div><div id="vig"></div>
<div id="hud">
  <div id="speed">0 <small>KM/H</small></div>
  <div id="offroad">OFF ROAD</div>
  <div id="money">◈ 0</div>
  <div id="boost"><span>BOOST</span><div id="boostBar"><i id="boostFill"></i></div></div>
  <div id="fare"></div>
</div>
<div id="toast"></div>
<div id="phone">
  <div class="pBody">
    <div class="pNotch"></div>
    <div class="pStatus"><span>NIGHTWAVE OS</span><span id="pClock">--:--</span><span>▮▮▮ ⬤</span></div>
    <div class="pCredits">
      <small>CREDITS</small><b id="pCred">0</b><em id="pRate">+0 / sec</em>
    </div>
    <div class="pTabs">
      <button data-tab="garage" class="on">TUNE</button>
      <button data-tab="rides">RIDES</button>
      <button data-tab="assets">ASSETS</button>
      <button data-tab="themes">STYLE</button>
      <button data-tab="stats">STATS</button>
    </div>
    <div class="pScreen" id="pScreen"></div>
  </div>
</div>
<div id="topBar">
  <button id="phoneBtn">▮ PHONE</button>
  <button id="menuBtn">⚙ THEMES</button>
  <button id="mute">♪ ON</button>
</div>
<div id="menu" hidden>
  <div class="mhead"><h3>COLOR QUEUE</h3><button class="x" id="menuClose">✕</button></div>
  <div id="nowPlaying"></div>
  <div id="queueList"></div>
  <div class="mrow">
    <button id="qAdd">+ ADD STEP</button>
    <button id="qPlay">▶ PLAY</button>
    <button id="qStop">■ STOP</button>
    <label><input type="checkbox" id="qLoop" checked> loop</label>
  </div>
  <div class="msub">TAP TO QUEUE · DOUBLE-TAP TO PREVIEW</div>
  <div id="paletteGrid"></div>
</div>
<div id="title">
  <h1>NIGHTWAVE<br>DRIVE</h1>
  <div class="jp">夜 の ド ラ イ ブ</div>
  <div class="press">PRESS ANY KEY — JUST DRIVE</div>
</div>
<div id="hint">◄ ► STEER&nbsp;&nbsp;▲ GAS&nbsp;&nbsp;▼ BRAKE&nbsp;&nbsp;SHIFT BOOST&nbsp;&nbsp;SPACE HOP&nbsp;·&nbsp;SPACE MID-AIR = KICKFLIP&nbsp;&nbsp;P PHONE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   NIGHTWAVE DRIVE — infinite vaporwave highway
   ================================================================ */
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x46125e, 260, 1000);
const baseFogColor = new THREE.Color(0x46125e);   // theme fog; darkened toward black inside tunnels
const BLACKC = new THREE.Color(0x000000);
const SUN_BASE = 0.9;

/* persistent player state — declared up here because the vehicle, theme and
   economy systems all read it, and the vehicle rig is built first */
const game={credits:0, up:{}, assets:{}, themes:{}, vehicles:{}, vehicle:0, totalDist:0, spent:0};

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .1, 3000);
camera.position.set(0,7,10);

/* ---------------- sky (gradient background) ---------------- */
const skyCanvas=document.createElement('canvas'); skyCanvas.width=4; skyCanvas.height=512;
const skyCtx=skyCanvas.getContext('2d');
const skyTex=new THREE.CanvasTexture(skyCanvas);
scene.background=skyTex;
function drawSky(c){
  const gr=skyCtx.createLinearGradient(0,0,0,512);
  gr.addColorStop(0.00,c[0]); gr.addColorStop(0.42,c[1]); gr.addColorStop(0.72,c[2]);
  gr.addColorStop(0.90,c[3]); gr.addColorStop(1.00,c[4]);
  skyCtx.fillStyle=gr; skyCtx.fillRect(0,0,4,512);
  skyTex.needsUpdate=true;
}

/* ---------------- constants ---------------- */
const HALF = 14;                 // half road width
const SEG  = 12;                 // section spacing
const NSEC = 120;                // sections in the ribbon
const TILE = 24;                 // road texture tile length (world units)

/* road centerline as a pure function of world distance s */
function roadX(s){ return 42*Math.sin(s*0.0035) + 70*Math.sin(s*0.0011+1.7); }

/* ---------------- lights ---------------- */
const ambLight=new THREE.AmbientLight(0x6633bb, 1.0); scene.add(ambLight);
const sunLight=new THREE.DirectionalLight(0xff88cc,.9);
sunLight.position.set(0,60,-100); scene.add(sunLight);

/* ---------------- road texture ---------------- */
const roadNoise=document.createElement('canvas'); roadNoise.width=roadNoise.height=256;
(function(){ const g=roadNoise.getContext('2d');
  for(let i=0;i<420;i++){ g.fillStyle='rgba(255,255,255,'+(Math.random()*0.03)+')';
    g.fillRect(Math.random()*256|0, Math.random()*256|0, 2,2); } })();
const roadCanvas=document.createElement('canvas'); roadCanvas.width=roadCanvas.height=256;
const roadCtx=roadCanvas.getContext('2d');
const roadTex=new THREE.CanvasTexture(roadCanvas);
roadTex.wrapT=THREE.RepeatWrapping; roadTex.magFilter=THREE.NearestFilter;
roadTex.minFilter=THREE.LinearMipMapLinearFilter;
function drawRoad(base,edge,dash){
  const g=roadCtx;
  g.fillStyle=base; g.fillRect(0,0,256,256);
  g.drawImage(roadNoise,0,0);
  g.fillStyle=edge; g.fillRect(8,0,10,256); g.fillRect(238,0,10,256);
  g.fillStyle=dash; g.fillRect(124,18,8,110);
  roadTex.needsUpdate=true;
}

/* ---------------- road ribbon geometry ---------------- */
function makeRibbon(width, y, material){
  const pos=new Float32Array(NSEC*2*3);
  const uv =new Float32Array(NSEC*2*2);
  const idx=[];
  for(let i=0;i<NSEC;i++){
    const z=20-i*SEG;
    pos[(i*2)*3+2]=z; pos[(i*2+1)*3+2]=z;
    pos[(i*2)*3+1]=y; pos[(i*2+1)*3+1]=y;
    uv[(i*2)*2]=0; uv[(i*2)*2+1]=-z/TILE;
    uv[(i*2+1)*2]=1; uv[(i*2+1)*2+1]=-z/TILE;
    if(i<NSEC-1){
      const a=i*2;
      idx.push(a,a+1,a+2, a+1,a+3,a+2);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo, material);
  mesh.frustumCulled=false;
  return mesh;
}
const roadMesh = makeRibbon(HALF, .15, new THREE.MeshBasicMaterial({map:roadTex, fog:true}));
scene.add(roadMesh);

const edgeMatL=new THREE.MeshBasicMaterial({color:0xff2d95, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false});
const edgeL = makeRibbon(.7,.32, edgeMatL);
const edgeR = makeRibbon(.7,.32, edgeMatL);
scene.add(edgeL, edgeR);

/* update ribbon x positions each frame */
function updateRibbons(dist){
  const p=roadMesh.geometry.attributes.position.array;
  const pl=edgeL.geometry.attributes.position.array;
  const pr=edgeR.geometry.attributes.position.array;
  for(let i=0;i<NSEC;i++){
    const z=20-i*SEG, s=dist-z, x=roadX(s);
    p[(i*2)*3]   = x-HALF; p[(i*2+1)*3] = x+HALF;
    pl[(i*2)*3]  = x-HALF-.2; pl[(i*2+1)*3]= x-HALF+1.4;
    pr[(i*2)*3]  = x+HALF-1.4; pr[(i*2+1)*3]= x+HALF+.2;
  }
  roadMesh.geometry.attributes.position.needsUpdate=true;
  edgeL.geometry.attributes.position.needsUpdate=true;
  edgeR.geometry.attributes.position.needsUpdate=true;
  roadTex.offset.y = dist/TILE;
}

/* ---------------- neon grid ground ---------------- */
const gridCanvas=document.createElement('canvas'); gridCanvas.width=gridCanvas.height=128;
const gridCtx=gridCanvas.getContext('2d');
const gridTex=new THREE.CanvasTexture(gridCanvas);
gridTex.wrapS=gridTex.wrapT=THREE.RepeatWrapping;
gridTex.minFilter=THREE.LinearMipMapLinearFilter;
function drawGrid(base,line){
  const g=gridCtx;
  g.globalAlpha=1; g.fillStyle=base; g.fillRect(0,0,128,128);
  g.globalAlpha=.9; g.strokeStyle=line; g.lineWidth=5; g.strokeRect(0,0,128,128);
  gridTex.needsUpdate=true;
}
const GRID_CELL=20;
let groundMat;   // dimmed inside the city so pavement reads instead of neon void
{
  const gw=2600, gl=3000;
  gridTex.repeat.set(gw/GRID_CELL, gl/GRID_CELL);
  groundMat=new THREE.MeshBasicMaterial({map:gridTex, fog:true});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(gw,gl), groundMat);
  ground.rotation.x=-Math.PI/2;
  ground.position.set(0,-.05,-1100);
  scene.add(ground);
}

/* ---------------- sky group: sun, mountains, stars ---------------- */
const skyGroup=new THREE.Group(); scene.add(skyGroup);

/* retro striped sun */
const sunCanvas=document.createElement('canvas'); sunCanvas.width=sunCanvas.height=512;
const sunCtx=sunCanvas.getContext('2d');
const sunTex=new THREE.CanvasTexture(sunCanvas);
function drawSun(c){
  const g=sunCtx;
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,512,512);
  const gr=g.createLinearGradient(0,20,0,492);
  gr.addColorStop(0,c[0]); gr.addColorStop(.45,c[1]); gr.addColorStop(.75,c[2]); gr.addColorStop(1,c[3]);
  g.fillStyle=gr;
  g.beginPath(); g.arc(256,256,236,0,Math.PI*2); g.fill();
  g.globalCompositeOperation='destination-out';
  let y=300,h=5;
  while(y<512){ g.fillRect(0,y,512,h); y+=h+16-h*.4; h+=5; }
  g.globalCompositeOperation='source-over';
  sunTex.needsUpdate=true;
}
const sunMesh=new THREE.Mesh(new THREE.PlaneGeometry(360,360),
  new THREE.MeshBasicMaterial({map:sunTex, transparent:true, fog:false, depthWrite:false}));

/* jagged mountain silhouettes */
const ridges=[];
function makeRidge(color, height, z, withEdge){
  const pts=[]; const W=1700;
  pts.push(new THREE.Vector2(-W,-10));
  for(let x=-W;x<=W;x+=110){
    pts.push(new THREE.Vector2(x, 20+Math.random()*height));
  }
  pts.push(new THREE.Vector2(W,-10));
  const shape=new THREE.Shape(pts);
  const mat=new THREE.MeshBasicMaterial({color:color, fog:false});
  const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
  mesh.position.set(0,0,z);
  skyGroup.add(mesh);
  const rec={mat, line:null};
  if(withEdge){
    const lp=pts.slice(1,-1).map(v=>new THREE.Vector3(v.x,v.y+.5,z+1));
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(lp),
      new THREE.LineBasicMaterial({color:0xff2d95, transparent:true, opacity:.55, fog:false}));
    skyGroup.add(line); rec.line=line.material;
  }
  ridges.push(rec);
}

/* taper the front (-Z) face of a box to get sharp, raked panels */
function wedge(w,h,d, fx,fy, dz){
  const g=new THREE.BoxGeometry(w,h,d);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    if(p.getZ(i) < 0){
      p.setX(i, p.getX(i)*fx);
      p.setY(i, p.getY(i)*fy);
      if(dz) p.setZ(i, p.getZ(i)+dz);
    }
  }
  g.computeVertexNormals();
  return g;
}

/* ---- shared builders ---- */
function addWheel(g, rig, x, y, z, r, w, isFront, spokes){
  const pivot=new THREE.Group(); pivot.position.set(x,y,z); g.add(pivot);
  const spin=new THREE.Group(); pivot.add(spin);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,20), vDark); tire.rotation.z=Math.PI/2; spin.add(tire);
  const rim =new THREE.Mesh(new THREE.CylinderGeometry(r*.6,r*.6,w*1.04,spokes||6), vRim); rim.rotation.z=Math.PI/2; spin.add(rim);
  const hub =new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,w*1.1,8), vB); hub.rotation.z=Math.PI/2; spin.add(hub);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r*.98,.055,8,22), x<0?vB:vA); ring.rotation.y=Math.PI/2; pivot.add(ring);
  rig.wheelSpin.push(spin);
  if(isFront) rig.frontWheels.push(pivot);
  return pivot;
}
function addFlame(g, rig, x, y, z, rOuter, len){
  const mk=(r,h,mat)=>{
    const geo=new THREE.ConeGeometry(r,h,12,1,true); geo.translate(0,h/2,0);
    const m=new THREE.Mesh(geo, mat);
    m.rotation.x=Math.PI/2; m.position.set(x,y,z); m.visible=false; g.add(m); return m;
  };
  rig.flames.push({ outer:mk(rOuter,len,vFlameO), inner:mk(rOuter*.48,len*.64,vFlameI) });
}
function addTailGlow(g, rig, y, z, w, h){
  const tg=new THREE.Mesh(new THREE.PlaneGeometry(w,h), vTailGlow);
  tg.position.set(0,y,z); tg.rotation.y=Math.PI; g.add(tg);
  rig.tailGlow=tg;
}

/* ================================================================
   ENVIRONMENT ZONES — mountains -> tunnel -> city, looping.
   Zones are hard regions of road distance. Objects are PLACED inside
   their own zone instead of being cross-faded in, so each setting is
   something you physically drive into.
   ================================================================ */
const CYCLE=12000;
const Z_MTN=0, Z_TUN=1, Z_CITY=2;
const TUN_A=4200, TUN_B=7400;      // tunnel window within a cycle
const CITY_A=7400, CITY_B=11600;   // the city starts the instant the tunnel ends
const FAR_HIDE=1450;               // past this everything is 100% fog colour anyway
const cycMod=s=>((s%CYCLE)+CYCLE)%CYCLE;
function zoneOf(s){ const u=cycMod(s);
  return u<TUN_A? Z_MTN : u<TUN_B? Z_TUN : u<CITY_B? Z_CITY : Z_MTN; }
/* absolute [start,end] of the current-or-next window of `zone`, at or after s */
function zoneWindow(s, zone){
  const a = zone===Z_TUN? TUN_A : zone===Z_CITY? CITY_A : CITY_B-CYCLE;
  const b = zone===Z_TUN? TUN_B : zone===Z_CITY? CITY_B : TUN_A;
  const base=Math.floor(s/CYCLE)*CYCLE;
  for(let k=0;k<3;k++){
    const A=base+k*CYCLE+a, B=base+k*CYCLE+b;
    if(s<B) return [A,B];
  }
  return [base+3*CYCLE+a, base+3*CYCLE+b];
}

/* ---------------- tunnel ----------------
   One tube whose rings are clamped to [A,B], so it has genuine ends:
   rings outside the window pile up on the mouth ring as zero-area
   triangles. A rock facade with an arch cut out frames each mouth. */
const TUN_W=HALF+3.6, TUN_H=9.7;
const TUN_CS=[ [-TUN_W,0.05], [-TUN_W,4.6], [-(HALF+1.6),8.3], [0,TUN_H],
               [HALF+1.6,8.3], [TUN_W,4.6], [TUN_W,0.05] ];
const TUN_NC=TUN_CS.length;
const tunMat=new THREE.MeshBasicMaterial({color:0x0b0b16, side:THREE.DoubleSide, fog:true});
const tunnel=(function(){
  const pos=new Float32Array(NSEC*TUN_NC*3), idx=[];
  for(let i=0;i<NSEC-1;i++) for(let j=0;j<TUN_NC-1;j++){
    const a=i*TUN_NC+j; idx.push(a,a+TUN_NC,a+1, a+1,a+TUN_NC,a+TUN_NC+1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo,tunMat); mesh.frustumCulled=false; scene.add(mesh);
  return {geo, mesh};
})();

const portalMat=new THREE.MeshBasicMaterial({color:0x151022, side:THREE.DoubleSide, fog:true});
function makePortal(){
  const W=420,H=240;   // wide enough to fill the view as you approach the mouth
  const sh=new THREE.Shape();
  sh.moveTo(-W,-8); sh.lineTo(W,-8); sh.lineTo(W,H); sh.lineTo(-W,H); sh.closePath();
  const hole=new THREE.Path();
  hole.moveTo(TUN_CS[0][0],TUN_CS[0][1]);
  for(let j=1;j<TUN_NC;j++) hole.lineTo(TUN_CS[j][0],TUN_CS[j][1]);
  hole.closePath();
  sh.holes.push(hole);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(sh), portalMat);
  m.frustumCulled=false; m.visible=false; scene.add(m); return m;
}
const portalIn=makePortal(), portalOut=makePortal();

/* ceiling lights live at fixed world positions inside the tunnel —
   nothing is recycled, so they can't drift or double up */
const LIGHT_SPACING=42;
const tunLightMat=new THREE.MeshBasicMaterial({color:0xffffff, fog:true});
const tunLights=[];
for(let i=0;i<26;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(4.2,.3,1.1), tunLightMat);
  m.visible=false; scene.add(m); tunLights.push(m);
}

function updateTunnel(dist, win){
  const A=win[0], B=win[1];
  const show=(A-dist)<FAR_HIDE;
  tunnel.mesh.visible=show; portalIn.visible=show; portalOut.visible=show;
  if(show){
    const p=tunnel.geo.attributes.position.array;
    for(let i=0;i<NSEC;i++){
      const s=Math.min(B, Math.max(A, dist-(20-i*SEG)));
      const x=roadX(s), z=dist-s;
      for(let j=0;j<TUN_NC;j++){ const k=(i*TUN_NC+j)*3;
        p[k]=TUN_CS[j][0]+x; p[k+1]=TUN_CS[j][1]; p[k+2]=z; }
    }
    tunnel.geo.attributes.position.needsUpdate=true;
    portalIn.position.set(roadX(A), 0, dist-A+0.5);    // nudged off the mouth ring
    portalOut.position.set(roadX(B), 0, dist-B-0.5);
  }
  const k0=Math.ceil((dist-30-A)/LIGHT_SPACING);
  for(let i=0;i<tunLights.length;i++){
    const s=A+(k0+i)*LIGHT_SPACING, m=tunLights[i];
    const vis = show && s>A+18 && s<B-18 && (s-dist)<FAR_HIDE;
    m.visible=vis;
    if(vis) m.position.set(roadX(s), TUN_H-0.45, dist-s);
  }
}
/* 0 outside the tunnel, 1 inside, with a short ramp at each mouth */
function tunFactor(s, win){
  return Math.max(0,Math.min(1,(s-win[0]+6)/30)) * Math.max(0,Math.min(1,(win[1]+14-s)/30));
}

/* ---------------- city ----------------
   Three tiers of towers: a street tier lining the road, a mid tier behind it,
   and a far tier of huge silhouettes that carries the skyline out to the fog.
   Windows are sized in world units and snapped to a whole number of tiles per
   face, so they never get sliced at a corner. */
const cityWinCanvas=document.createElement('canvas'); cityWinCanvas.width=cityWinCanvas.height=128;
(function(){
  const g=cityWinCanvas.getContext('2d');
  g.fillStyle='#05050c'; g.fillRect(0,0,128,128);
  const G=4, CELL=128/G;
  for(let ry=0;ry<G;ry++){
    const darkFloor=Math.random()<0.22;
    g.fillStyle='#0a0a16'; g.fillRect(0, ry*CELL+CELL-4, 128, 4);   // floor band
    for(let cx=0;cx<G;cx++){
      if(!darkFloor && Math.random()<0.72)
        g.fillStyle='rgba(255,255,255,'+(0.55+Math.random()*0.45).toFixed(2)+')';
      else g.fillStyle='#0d0d1c';
      g.fillRect(cx*CELL+5, ry*CELL+5, CELL-10, CELL-13);
    }
  }
})();
const cityTex=new THREE.CanvasTexture(cityWinCanvas);
cityTex.wrapS=cityTex.wrapT=THREE.RepeatWrapping;
cityTex.magFilter=THREE.NearestFilter; cityTex.minFilter=THREE.LinearMipMapLinearFilter;
const cityMat=new THREE.MeshBasicMaterial({map:cityTex, color:0x9fb0e0, fog:true, vertexColors:true});
const cityCapMat=new THREE.MeshBasicMaterial({color:0xff2d95, fog:true});
const UWIN=13, VWIN=15;          // world units per 4x4 window tile -> ~3.3u windows

/* Per-face UV scaling AND per-face shading. MeshBasic is unlit, so without
   vertex colours every side of a box renders identically and the towers read
   as flat cardboard. */
function towerGeo(w,h,d){
  const g=new THREE.BoxGeometry(w,h,d);
  const uv=g.attributes.uv, col=[];
  const ux=Math.max(1,Math.round(d/UWIN));   // +-X faces span the depth
  const uz=Math.max(1,Math.round(w/UWIN));   // +-Z faces span the width
  const vy=Math.max(2,Math.round(h/VWIN));
  const face=(i0,su,sv,shade)=>{
    for(let i=i0;i<i0+4;i++){ uv.setXY(i, uv.getX(i)*su, uv.getY(i)*sv); col.push(shade,shade,shade); }
  };
  face(0,  ux,vy, 1.00);      // +X — faces the street once rotated
  face(4,  ux,vy, 1.00);      // -X
  face(8,  .02,.02, 0.30);    // +Y roof -> dark corner texel (never seen, towers are tall)
  face(12, .02,.02, 0.30);    // -Y
  face(16, uz,vy, 0.66);      // +Z — shaded, so corners read as corners
  face(20, uz,vy, 0.66);      // -Z
  uv.needsUpdate=true;
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  return g;
}

const TIER_RANGE=[2000,2400,2800];
const buildings=[];
function makeBuilding(tier){
  let w,d,h;
  if(tier===0){      w=16+Math.random()*24; d=16+Math.random()*22; h= 45+Math.random()*165; }
  else if(tier===1){ w=28+Math.random()*34; d=26+Math.random()*30; h=120+Math.random()*200; }
  else {             w=55+Math.random()*80; d=50+Math.random()*70; h=230+Math.random()*220; }
  const g=new THREE.Group();
  const tower=new THREE.Mesh(towerGeo(w,h,d), cityMat);
  tower.position.y=h/2; g.add(tower);
  let top=h;
  if(tier<2 && Math.random()<0.38){                       // stepped setback
    const w2=w*(0.55+Math.random()*0.2), d2=d*(0.55+Math.random()*0.2), h2=h*(0.18+Math.random()*0.22);
    const t2=new THREE.Mesh(towerGeo(w2,h2,d2), cityMat);
    t2.position.y=h+h2/2; g.add(t2); top=h+h2;
  }
  if(tier===0 && Math.random()<0.6){                      // neon roofline
    const cap=new THREE.Mesh(new THREE.BoxGeometry(w+1.6,0.9,d+1.6), cityCapMat);
    cap.position.y=top+0.45; g.add(cap);
  }
  if(tier<2 && Math.random()<0.3){                        // mast + beacon
    const mh=14+Math.random()*26;
    const mast=new THREE.Mesh(new THREE.BoxGeometry(.9,mh,.9), cityCapMat);
    mast.position.y=top+mh/2; g.add(mast);
    top+=mh;
  }
  g.visible=false; scene.add(g);
  return {g, w, d, h:top, halfW:w/2+1.0, tier, range:TIER_RANGE[tier], s:0, offset:0, rot:0};
}
for(let i=0;i<52;i++) buildings.push(makeBuilding(0));
for(let i=0;i<22;i++) buildings.push(makeBuilding(1));
for(let i=0;i<18;i++) buildings.push(makeBuilding(2));

/* Clear shoulder between the road edge and any wall. Must exceed the drivable
   corridor: lateral maxes out at HALF+4 and the car's body reaches 2.5 past
   that, so anything under ~6.5 lets you drive straight into a building. */
const CITY_CLEAR=10;
function placeBuilding(b, minS){
  let s=minS;
  if(zoneOf(s)!==Z_CITY) s=zoneWindow(s,Z_CITY)[0] + Math.random()*b.range;
  b.s=s;
  b.rot=-(roadX(s+3)-roadX(s-3))/6;                    // square up to the road tangent
  const side=Math.random()<.5?-1:1;

  if(b.tier>0){                                        // back tiers sit well clear already
    const base=b.tier===1? HALF+70 : HALF+240;
    const spread=b.tier===1? 140 : 420;
    b.offset=side*(base+b.halfW+Math.random()*spread);
    return;
  }

  // On the inside of a bend the road sweeps toward the building, so hand it
  // roughly the distance the centreline cuts across over the next stretch.
  const curv=(roadX(s+60)-2*roadX(s)+roadX(s-60))/3600;
  const bendRoom=(Math.sign(curv)===side)? Math.min(26, Math.abs(curv)*20000) : 0;
  const setback=Math.pow(Math.random(),1.7)*32 + bendRoom;

  // Solve rather than guess: the rotated footprint spans a range of road
  // distance and the centreline moves across it, so sample the real corners.
  // Raising `off` lifts the worst gap ~1:1, so this converges in a pass or two.
  const c=Math.cos(b.rot), sn=Math.sin(b.rot);
  let off=HALF+CITY_CLEAR+b.halfW+setback;
  for(let pass=0; pass<4; pass++){
    let gap=Infinity;
    for(const lx of [-b.halfW, b.halfW]) for(let k=-5;k<=5;k++){
      const lz=k*b.d/10;
      const wx=roadX(s)+side*off+lx*c+lz*sn;          // corner in world x
      const ws=s+lx*sn-lz*c;                          // ...and its road distance
      gap=Math.min(gap, side*(wx-roadX(ws))-HALF);
    }
    if(gap>=CITY_CLEAR-0.01) break;
    off+=CITY_CLEAR-gap;
  }
  b.offset=side*off;
  if(b.sign){                                   // turn the signage to face the street
    b.sign.position.x=-side*(b.w/2+0.4);
    b.sign.rotation.y=-side*Math.PI/2;
  }
}
buildings.forEach(b=> placeBuilding(b, CITY_A+Math.random()*b.range));
function updateCity(dist, viewFar){
  for(const b of buildings){
    let z=dist-b.s;
    const behind=b.d/2+80;
    if(z>behind){ placeBuilding(b, b.s+b.range+Math.random()*160); z=dist-b.s; }
    const vis = zoneOf(b.s)===Z_CITY && (b.s-dist)<viewFar && z<b.d/2+40;
    b.g.visible=vis;
    if(vis){ b.g.position.set(roadX(b.s)+b.offset, 0, z); b.g.rotation.y=b.rot; }
  }
}
/* how deep into the city we are — used to open the fog up so the skyline reads */
function cityDepth(s){
  const [A,B]=zoneWindow(s-60, Z_CITY);
  if(s>B) return 0;
  return Math.max(0,Math.min(1,(s-(A-1000))/1000)) * Math.max(0,Math.min(1,(B-s)/900));
}

/* ---------------- city furniture ----------------
   What made the city read as "a road with buildings beside it" was that
   nothing ever crossed over, above or under the car. These add pavement
   underfoot, lamps leaning over the lane, and structures you drive beneath. */

/* generic road-following strip, clamped to a zone window like the tunnel.
   cross-section entries are [x, y, shade]; duplicate a point to get a hard
   shading crease instead of a gradient. */
function makeStrip(cs, mat){
  const NC=cs.length, pos=new Float32Array(NSEC*NC*3), col=[], idx=[];
  for(let i=0;i<NSEC;i++) for(let j=0;j<NC;j++){ const sh=cs[j][2]; col.push(sh,sh,sh); }
  for(let i=0;i<NSEC-1;i++) for(let j=0;j<NC-1;j++){
    const a=i*NC+j; idx.push(a,a+NC,a+1, a+1,a+NC,a+NC+1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo,mat); mesh.frustumCulled=false; mesh.visible=false; scene.add(mesh);
  return {geo,mesh,cs,NC};
}
function updateStrip(st, dist, A, B, viewFar){
  const show=(A-dist)<viewFar;
  st.mesh.visible=show;
  if(!show) return;
  const p=st.geo.attributes.position.array;
  for(let i=0;i<NSEC;i++){
    const s=Math.min(B,Math.max(A, dist-(20-i*SEG)));
    const x=roadX(s), z=dist-s;
    for(let j=0;j<st.NC;j++){ const k=(i*st.NC+j)*3;
      p[k]=st.cs[j][0]+x; p[k+1]=st.cs[j][1]; p[k+2]=z; }
  }
  st.geo.attributes.position.needsUpdate=true;
}

const CURB=HALF+3, WALK_OUT=HALF+13;         // gutter, then raised pavement
const walkMat=new THREE.MeshBasicMaterial({color:0x2a2a3a, side:THREE.DoubleSide, fog:true, vertexColors:true});
const walkL=makeStrip([[-WALK_OUT,.62,.85],[-CURB,.62,1.0],[-CURB,.62,.45],[-CURB,.08,.45]], walkMat);
const walkR=makeStrip([[CURB,.08,.45],[CURB,.62,.45],[CURB,.62,1.0],[WALK_OUT,.62,.85]], walkMat);

/* streetlights on alternating sides, arms leaning out over the lane */
const poleMat=new THREE.MeshBasicMaterial({color:0x14141f, fog:true});
const lampMat=new THREE.MeshBasicMaterial({color:0xffe9c0, fog:true});
const LAMP_SPACING=50;
const streetLights=[];
for(let i=0;i<30;i++){

/* deterministic placement: fixed world positions inside the city window, so
   nothing recycles and nothing can drift or double up */
function placeAlong(pool, dist, A, B, spacing, viewFar, y, fn){
  const k0=Math.ceil((dist-45-A)/spacing);
  for(let i=0;i<pool.length;i++){
    const k=k0+i, s=A+k*spacing, g=pool[i];
    const vis = s>A+40 && s<B-40 && (s-dist)<viewFar && (dist-s)<60;
    g.visible=vis;
    if(vis){ g.position.set(roadX(s), y, dist-s); if(fn) fn(g,k,s); }
  }
}
function updateCityFurniture(dist, viewFar){

  updateStrip(walkL, dist, A, B, viewFar);
  updateStrip(walkR, dist, A, B, viewFar);
  placeAlong(streetLights, dist, A, B, LAMP_SPACING, viewFar, 0, (g,k)=>{
    const side=(k%2===0)?1:-1;
    g.position.x+=side*(HALF+6.5);
    g.rotation.y=side>0?0:Math.PI;      // swing the arm out over the road
  });
  placeAlong(overpasses, dist, A, B, OVERPASS_SPACING, viewFar, 0, null);
  placeAlong(skyBridges, dist, A, B, SKYBRIDGE_SPACING, viewFar, 0, (g,k)=>{
    g.position.y = 44 + (k%3)*11;
  });
}

function fareValue(){
  const perSec = engineTop()*EARN_PER_UNIT*earnMult() + passiveRate();
  return Math.max(FARE_MIN, perSec*FARE_SECONDS);
}

/* exactly one pad is prime; which one is re-drawn each time the pads move to a
   fresh city, so it is not tied to a pool index or to road order */
function assignPrime(){
  // Weighted toward the pads further down the road, so claiming the bonus
  // usually means passing up a nearer, ordinary pad rather than luck.
  const order=drops.slice().sort((a,b)=>a.s-b.s);      // nearest first
  const w=order.map((_,i)=>1+i*3);                     // 2 pads -> 25% near / 75% far
  let r=Math.random()*w.reduce((a,b)=>a+b,0), k=0;
  while(k<w.length-1 && r>w[k]){ r-=w[k]; k++; }
  drops.forEach(d=> d.prime=false);
  order[k].prime=true;
}

}

  h.lat=side*(HALF+2.2+Math.random()*1.3);       // just past the tarmac: you must pull off
  h.face=side>0? Math.PI : 0;                    // spin so the thumb always points at the road
  h.g.scale.setScalar(0.94+Math.random()*0.16);  // not everyone is the same size
  h.active=true;
}
function placeDrop(d, minS){
  let s=minS+1200+Math.random()*1500, fresh=false;
  if(zoneOf(s)!==Z_CITY){ s=zoneWindow(s,Z_CITY)[0]+300+Math.random()*3200; fresh=true; }
  d.s=s;
  d.lat=(Math.random()<.5?-1:1)*(HALF-3.5);      // a bay in the outer lane, inside the kerbs
  if(fresh) assignPrime();                       // new city ahead -> re-draw the prime pad
}

function updateRides(dist, viewFar, t){
  // --- hitchhikers ---
  let nearest=Infinity;
  for(const h of hikers){
    if(!h.active || dist-h.s>40) placeHiker(h, Math.max(dist, h.s));
    const z=dist-h.s;
    const vis = zoneOf(h.s)===Z_MTN && (h.s-dist)<viewFar && z<30;
    h.g.visible=vis;
    if(vis){
      h.g.position.set(roadX(h.s)+h.lat, 0, z);
      h.g.rotation.y=-(roadX(h.s+3)-roadX(h.s-3))/6 + h.face;
      h.pin.position.y=PIN_Y+Math.sin(t*3)*0.4;
      h.pin.rotation.y=t*1.6;
      if(!passenger && h.s-dist>-20) nearest=Math.min(nearest, h.s-(dist+8));
    }
    if(h.active && !passenger && Math.abs(dist+8-h.s)<9 && Math.abs(lateral-h.lat)<2.8){
      h.active=false; h.g.visible=false; pickUp();
    }
  }
  // --- drop-off pads ---
  let nearestDrop=Infinity, nearestPrime=Infinity;
  for(const d of drops){
    if(dist-d.s>60) placeDrop(d, Math.max(dist, d.s));
    const prime=d.prime;
    d.pad.material  = prime? primePadMat  : dropPadMat;
    d.ring.material = prime? primeRingMat : dropRingMat;
    d.beam.material = prime? primeBeamMat : dropBeamMat;
    const z=dist-d.s;
    const vis = passenger && zoneOf(d.s)===Z_CITY && (d.s-dist)<viewFar && z<40;
    d.g.visible=vis;
    if(vis){
      d.g.position.set(roadX(d.s)+d.lat, 0, z);
      d.ring.rotation.z = prime? -t*2.1 : t*1.1;          // the prime pad spins faster
      d.g.scale.setScalar(prime? 1.15+Math.sin(t*4)*0.05 : 1);
      if(d.s-dist>-20){
        nearestDrop=Math.min(nearestDrop, d.s-(dist+8));
        if(prime) nearestPrime=Math.min(nearestPrime, d.s-(dist+8));
      }
      if(Math.abs(dist+8-d.s)<9 && Math.abs(lateral-d.lat)<6) dropOff(prime);
    }
  }
  // --- prompt line ---
  if(passenger){
    const f=fareValue();
    if(nearestPrime<Infinity)
      fareEl.textContent='\u2605 PRIME DROP '+Math.round(nearestPrime)+'m  \u00B7  \u25C8'+fmtC(f*BONUS_MULT)+'  (x'+BONUS_MULT+')';
    else if(nearestDrop<Infinity)
      fareEl.textContent='\u25B8 DROP ZONE '+Math.round(nearestDrop)+'m  \u00B7  \u25C8'+fmtC(f);
    else
      fareEl.textContent='\u263A PASSENGER  \u00B7  \u25C8'+fmtC(f)+'  \u00B7  HEAD FOR THE CITY';
    fareEl.style.opacity=1;
  }else if(nearest<520){
    fareEl.textContent='\u261A HITCHHIKER '+Math.round(nearest)+'m  \u00B7  PULL OFF THE ROAD';
    fareEl.style.opacity=1;
  }else fareEl.style.opacity=0;
}
function pickUp(){
  passenger=true;
  toast('PASSENGER ABOARD \u2014 \u2605 PRIME PAD PAYS x'+BONUS_MULT);
}
function dropOff(prime){
  const fare=fareValue()*(prime? BONUS_MULT : 1);
  game.credits+=fare; game.rides=(game.rides||0)+1;
  passenger=false;
  save();
  toast(prime? 'PRIME DROP  \u25C8'+fmtC(fare)+'  (x'+BONUS_MULT+')' : 'FARE PAID  \u25C8'+fmtC(fare));
}

/* ================================================================
   COLOR THEMES — a queue of palette shifts across the whole world
   ================================================================ */
function hx(c){ c=c.replace('#',''); if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }
function hex(a){ return '#'+a.map(v=>('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2)).join(''); }
function mix(a,b,t){ const x=hx(a),y=hx(b);
  return hex([x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t, x[2]+(y[2]-x[2])*t]); }
const lighten=(c,t)=>mix(c,'#ffffff',t), darken=(c,t)=>mix(c,'#000000',t);
function rgba(c,a){ const x=hx(c); return 'rgba('+x[0]+','+x[1]+','+x[2]+','+a+')'; }
/* rotate a colour's hue, for the animated premium palettes */
function hueShift(c, deg){
  const [r,g,b]=hx(c).map(v=>v/255);
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
  const sat = d===0? 0 : d/(1-Math.abs(2*l-1));
  let h=0;
  if(d!==0){
    if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  h=(h+deg)%360; if(h<0) h+=360;
  const C=(1-Math.abs(2*l-1))*sat, X=C*(1-Math.abs((h/60)%2-1)), m=l-C/2;
  let q;
  if(h<60) q=[C,X,0]; else if(h<120) q=[X,C,0]; else if(h<180) q=[0,C,X];
  else if(h<240) q=[0,X,C]; else if(h<300) q=[X,0,C]; else q=[C,0,X];
  return hex([(q[0]+m)*255,(q[1]+m)*255,(q[2]+m)*255]);
}

function lerpTheme(A,B,t){

    const a=A[k],b=B[k];

  }

}

let queue=[ {p:0,m:0,s:20}, {p:1,m:0,s:20}, {p:4,m:0,s:20}, {p:11,m:0,s:20} ];
let qIndex=0, qPlaying=false, segStart=performance.now();
let fromTheme=expand(PALETTES[0]), toTheme=expand(PALETTES[0]), lastApplied=fromTheme, themeForce=true;
let toIdx=0, animLast=0;   // palette index behind toTheme + animation throttle
const TRANS=1.8;
const easeIO=x=>x<.5? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const segDur=q=>Math.max(1,(q.m|0)*60+(q.s|0));
const fmtT=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); };

applyTheme(fromTheme);

function startQueue(){
  if(!queue.length) return;
  qPlaying=true; qIndex=0; segStart=performance.now();
  fromTheme=lastApplied; toIdx=queue[0].p; toTheme=expand(PALETTES[toIdx]); themeForce=true;
}
function previewPalette(i){
  qPlaying=false;
  fromTheme=lastApplied; toIdx=i; toTheme=expand(PALETTES[i]); segStart=performance.now(); themeForce=true;
}
function tickTheme(now){
  // animated palettes re-expand on a ~16fps throttle; applyTheme redraws several
  // canvases, so doing it every frame would be wasteful for a slow colour cycle
  if(PALETTES[toIdx] && PALETTES[toIdx].anim && now-animLast>60){
    animLast=now;
    toTheme=expand(paletteAt(toIdx, now/1000));
    themeForce=true;
  }
  const seg=queue[qIndex]||queue[0];
  const dur=seg? segDur(seg):999;
  const el=(now-segStart)/1000;
  if(el<=TRANS+0.2 || themeForce){
    const k=easeIO(Math.min(1, el/TRANS));
    lastApplied=lerpTheme(fromTheme,toTheme,k);
    applyTheme(lastApplied);
    themeForce=false;
  }
  if(menuOpen){
    if(qPlaying){
      npName.textContent='▶ '+toTheme.name;
      npTime.textContent=fmtT(el)+' / '+fmtT(dur);
      npBar.style.width=Math.min(100, el/dur*100)+'%';
    }else{
      npName.textContent=lastApplied.name+' — paused';
      npTime.textContent=''; npBar.style.width='0%';
    }
  }
  if(qPlaying && seg && el>=dur){
    let ni=qIndex+1;
    if(ni>=queue.length){ if(!qLoopEl.checked){ qPlaying=false; return; } ni=0; }
    qIndex=ni; segStart=now;
    fromTheme=toTheme; toIdx=queue[qIndex].p; toTheme=expand(PALETTES[toIdx]); themeForce=true;
  }
}

function fmtC(n){
  if(n<1000) return n<10? n.toFixed(1) : Math.floor(n).toString();
  const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc'];
  let i=0; while(n>=1000 && i<u.length-1){ n/=1000; i++; }
  return (n<10? n.toFixed(2) : n<100? n.toFixed(1) : Math.round(n))+u[i];
}

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    credits:game.credits, up:game.up, assets:game.assets, themes:game.themes, rides:game.rides||0,
    vehicles:game.vehicles, vehicle:game.vehicle,
    totalDist:game.totalDist, spent:game.spent, t:Date.now()
  })); }catch(e){}
}
function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!d) return;
  game.credits=+d.credits||0; game.up=d.up||{}; game.assets=d.assets||{}; game.themes=d.themes||{};
  game.vehicles=d.vehicles||{}; game.vehicle=+d.vehicle||0;
  game.totalDist=+d.totalDist||0; game.spent=+d.spent||0; game.rides=+d.rides||0;
  UPGRADES.forEach(u=>{ if(game.up[u.id]>u.max) game.up[u.id]=u.max; });   // re-tuned caps
  const away=Math.min((Date.now()-(d.t||Date.now()))/1000, 8*3600);   // cap at 8h
  const earned=passiveRate()*away;
  if(earned>1){
    game.credits+=earned;
    toast('ASSETS EARNED ◈'+fmtC(earned)+' WHILE AWAY');
  }
}

    PALETTES.forEach((p,i)=>{
      const own=themeOwned(i);
      if(!p.price && !p.secret) return;                     // the base palettes are free
      if(p.secret && !own) return;                          // nothing to advertise
      const d=document.createElement('div'); d.className='pRow'+(own?' owned':'');
      d.innerHTML='<div class="pInfo"><b></b><span class="tSw">'+
        ['bg','primary','secondary','glow'].map(k=>'<i style="background:'+p[k]+'"></i>').join('')+
        '</span><i class="tR'+p.rarity+'"></i></div>';
      d.querySelector('b').textContent=p.name;
      d.querySelector('i').textContent=RARITY[p.rarity]+(p.anim?'  ·  ANIMATED':'');
      const btn=document.createElement('button'); btn.className='pBuy';
      if(own){ btn.textContent='OWNED'; btn.classList.add('no'); }
      else{
        btn.textContent='◈'+fmtC(p.price);
        btn.addEventListener('click',()=>buyTheme(i));
        buyBtns.push({el:btn, cost:p.price});
      }
      d.appendChild(btn); pScreen.appendChild(d);
    });
    const box=document.createElement('div'); box.className='pCode';
    box.innerHTML='<small>REDEEM CODE</small><div>'+
      '<input id="pCodeIn" type="text" placeholder="enter code" maxlength="24" autocomplete="off" spellcheck="false">'+
      '<button id="pCodeGo">GO</button></div>';
    pScreen.appendChild(box);
    document.getElementById('pCodeGo').addEventListener('click', redeem);
    document.getElementById('pCodeIn').addEventListener('keydown', e=>{ if(e.key==='Enter') redeem(); });
  } else if(phoneTab==='assets'){
    for(const a of ASSETS){
      const n=owned(a);
      pScreen.appendChild(row(a.icon, a.name, a.desc,
        'OWNED '+n+'  ·  ◈'+fmtC(a.rate)+'/s each', assetCost(a), false, ()=>buyAsset(a)));
    }
  } else {
    const rows=[
      ['Distance driven', fmtC(game.totalDist)+' u'],
      ['Passive income',  '◈'+fmtC(passiveRate())+' / sec'],
      ['Per distance',    '◈'+(EARN_PER_UNIT*earnMult()).toFixed(3)+' / u'],
      ['Top speed',       Math.round(boostTop()*1.6)+' km/h'],
      ['Cruise speed',    Math.round(cruiseTop()*1.6)+' km/h'],
      ['Boost duration',  (BOOST_CAP/boostDrain()).toFixed(1)+' s'],
      ['Boost recharge',  (BOOST_CAP/boostRegen()).toFixed(1)+' s'],
      ['Vehicle',         VEHICLES[game.vehicle].name],
      ['Assets owned',    ASSETS.reduce((t,a)=>t+owned(a),0)],
      ['Fares delivered', game.rides||0],
      ['Fare value',      '◈'+fmtC(fareValue())+'  (prime ◈'+fmtC(fareValue()*BONUS_MULT)+')'],
      ['Total spent',     '◈'+fmtC(game.spent)],
    ];
    for(const [k,v] of rows){
      const d=document.createElement('div'); d.className='pStat';
      d.innerHTML='<span></span><span></span>';
      d.children[0].textContent=k; d.children[1].textContent=v;
      pScreen.appendChild(d);
    }
  }
  refreshAfford();
}
function refreshAfford(){
  for(const b of buyBtns) b.el.classList.toggle('no', game.credits < b.cost);
}
function buyUpgrade(u){
  const c=upCost(u);
  if(upLv(u)>=u.max || game.credits<c) return;
  game.credits-=c; game.spent+=c; game.up[u.id]=upLv(u)+1;
  save(); renderPhone();
}
function buyTheme(i){
  const p=PALETTES[i];
  if(themeOwned(i) || game.credits<p.price) return;
  game.credits-=p.price; game.spent+=p.price; game.themes[p.name]=1;
  save(); renderPhone(); renderPalettes(); renderQueue();
  toast('UNLOCKED — '+p.name.toUpperCase());
}
function buyVehicle(i){
  const v=VEHICLES[i];
  if(vehicleOwned(i) || game.credits<v.price) return;
  game.credits-=v.price; game.spent+=v.price; game.vehicles[v.id]=1;
  setVehicle(i); save(); renderPhone();
  toast('UNLOCKED — '+v.name.toUpperCase());
}
function redeem(){
  const el=document.getElementById('pCodeIn');
  const v=(el.value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  el.value='';
  if(!v) return;
  const i=PALETTES.findIndex(p=>p.code===v);
  if(i<0){ toast('INVALID CODE'); return; }
  if(themeOwned(i)){ toast('ALREADY UNLOCKED'); return; }
  game.themes[PALETTES[i].name]=1;
  save(); renderPhone(); renderPalettes(); renderQueue();
  toast('SECRET UNLOCKED \u2014 '+PALETTES[i].name.toUpperCase());
  previewPalette(i);                       // show it off straight away
}
function buyAsset(a){
  const c=assetCost(a);
  if(game.credits<c) return;
  game.credits-=c; game.spent+=c; game.assets[a.id]=owned(a)+1;
  save(); renderPhone();
}

/* ---- upgrade effects, read by the driving loop ---- */
const engineTop  = ()=> 215 + lvOf(UP_BY.engine)*ENGINE_TOP_STEP;
const cruiseTop  = ()=> 95  + lvOf(UP_BY.engine)*ENGINE_CRUISE_STEP;   // coasting speed, no W held
const boostTop   = ()=> 310 + lvOf(UP_BY.turbo)*16;
const accelRate  = ()=> 55  + lvOf(UP_BY.gearbox)*7;
const earnMult   = ()=> 1 + lvOf(UP_BY.odometer)*0.18;
const boostDrain = ()=> BOOST_DRAIN*(1 - lvOf(UP_BY.coolant)*COOLANT_STEP);
const boostRegen = ()=> BOOST_REGEN*(1 + lvOf(UP_BY.charger)*CHARGER_STEP);

const moneyEl=document.getElementById('money');
let hudT=0;
function tickEconomy(dt, speed){
  const moved=speed*dt;
  game.totalDist+=moved;
  game.credits += moved*EARN_PER_UNIT*earnMult() + passiveRate()*dt;
  hudT+=dt;
  if(hudT>0.1){
    hudT=0;
    moneyEl.textContent='◈ '+fmtC(game.credits);
    if(phoneOpen){
      pCred.textContent=fmtC(game.credits);
      pRate.textContent='+'+fmtC(passiveRate())+' / sec passive';
      const d=new Date();
      pClock.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
      refreshAfford();
    }
  }
}

/* ---------------- input ---------------- */
const keys={};
const typing=e=>/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
let touchSteer=0, touchAccel=false;

/* --- hop + kickflip --- */
let airborne=false, jumpY=0, jumpVY=0;
let flipping=false, flipUsed=false, flipT=0, flipDir=1, flipAngle=0;
let landAge=999, landMag=0, pitch=0;
const JUMP_V=22, GRAV=40, FLIP_DUR=0.78;  // airtime ~1.1s; one full kickflip takes 0.78s
const easeInOut=x=> 0.5 - 0.5*Math.cos(Math.PI*x);   // easeInOutSine — smooth, even rotation speed
function steerDir(){
  const k=(keys['ArrowRight']||keys['KeyD']?1:0)-(keys['ArrowLeft']||keys['KeyA']?1:0);
  if(k) return k;
  if(touchSteer) return touchSteer>0?1:-1;
  return (typeof steerVis!=='undefined' && Math.abs(steerVis)>.05) ? (steerVis>0?1:-1) : 1;
}
function doJump(){
  startGame();
  if(!airborne){                        // first press on the ground: hop
    airborne=true; jumpVY=JUMP_V; flipUsed=false; flipping=false; flipT=0; flipAngle=0;
  }else if(!flipUsed && !flipping){      // second press mid-air: kickflip toward the steer input
    const tLand=(jumpVY + Math.sqrt(jumpVY*jumpVY + 2*GRAV*jumpY))/GRAV;   // airtime remaining
    if(tLand >= FLIP_DUR + 0.04){        // only if the whole rotation fits before touchdown
      flipUsed=true; flipping=true; flipT=0; flipDir=-steerDir();
    }
  }
}

addEventListener('keydown',e=>{
  if(typing(e)) return;                                    // let the code box keep its keystrokes
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) doJump(); }
  if(e.code==='KeyP' && !e.repeat){ togglePhone(); return; }
  if(e.code==='Escape' && phoneOpen){ togglePhone(false); return; }
  keys[e.code]=true; startGame();
});
addEventListener('keyup',e=>{ if(typing(e))return; keys[e.code]=false;});
function handleTouch(e){
  touchSteer=0; touchAccel=false;
  for(const t of e.touches){
    if(t.clientY < innerHeight*.35){ touchAccel=true; }
    else touchSteer += (t.clientX < innerWidth/2 ? -1 : 1);
  }
  touchSteer=Math.max(-1,Math.min(1,touchSteer));
}
addEventListener('touchstart',e=>{handleTouch(e); startGame();},{passive:true});
addEventListener('touchmove',handleTouch,{passive:true});
addEventListener('touchend',handleTouch,{passive:true});

/* ---------------- synthwave audio ---------------- */
let actx=null, masterOut=null, muted=false;
const CHORDS=[
  {root:41, notes:[53,57,60,64]},   // Fmaj7
  {root:43, notes:[55,59,62,67]},   // G
  {root:45, notes:[57,60,64,67]},   // Am7
  {root:40, notes:[55,59,62,64]},   // Em7
];
const BPM=96, BEAT=60/BPM, STEP=BEAT/4;
const m2f=m=>440*Math.pow(2,(m-69)/12);
let step=0, nextT=0, delayNode=null, delaySend=null, noiseBuf=null;

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  actx=new AC();
  masterOut=actx.createGain(); masterOut.gain.value=.55;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3400;
  masterOut.connect(lp); lp.connect(actx.destination);
  delayNode=actx.createDelay(1); delayNode.delayTime.value=STEP*3;
  const fb=actx.createGain(); fb.gain.value=.34;
  delayNode.connect(fb); fb.connect(delayNode);
  const dg=actx.createGain(); dg.gain.value=.5;
  delayNode.connect(dg); dg.connect(masterOut);
  delaySend=delayNode;
  noiseBuf=actx.createBuffer(1, actx.sampleRate*.5, actx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  nextT=actx.currentTime+.1;
  setInterval(schedule,90);
}
function env(g,t,a,peak,dec){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);
}
function tone(type,freq,t,a,peak,dec,dest,detune){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; if(detune)o.detune.value=detune;
  env(g,t,a,peak,dec);
  o.connect(g); g.connect(dest||masterOut);
  o.start(t); o.stop(t+a+dec+.05);
}
function schedule(){
  while(nextT < actx.currentTime+.35){
    const bar=Math.floor(step/16), inBar=step%16;
    const ch=CHORDS[bar%4];
    if(inBar===0){ // pad
      ch.notes.forEach(n=>{
        tone('sawtooth',m2f(n),nextT,.6,.035,BEAT*4,masterOut,4);
        tone('sawtooth',m2f(n),nextT,.6,.035,BEAT*4,masterOut,-5);
      });
    }
    if(inBar%4===0){ // kick
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(140,nextT);
      o.frequency.exponentialRampToValueAtTime(42,nextT+.11);
      env(g,nextT,.004,.5,.2);
      o.connect(g); g.connect(masterOut); o.start(nextT); o.stop(nextT+.3);
    }
    if(inBar%2===0){ // bass eighths
      const add=[0,0,7,0,12,0,7,10][inBar/2];
      tone('sawtooth',m2f(ch.root+add),nextT,.01,.13,.24);
    }else{ // offbeat hat
      const src=actx.createBufferSource(); src.buffer=noiseBuf;
      const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
      const g=actx.createGain(); env(g,nextT,.002,.045,.05);
      src.connect(hp); hp.connect(g); g.connect(masterOut);
      src.start(nextT); src.stop(nextT+.08);
    }
    // arp 16ths into delay
    const an=ch.notes[step % ch.notes.length]+12;
    tone('triangle',m2f(an),nextT,.005,.06,.13,delaySend);
    step++; nextT+=STEP;
  }
}
document.getElementById('mute').addEventListener('click',e=>{
  e.stopPropagation();
  startGame();
  muted=!muted;
  if(masterOut) masterOut.gain.value = muted? 0 : .55;
  e.target.textContent = muted? '♪ OFF' : '♪ ON';
  e.target.blur();   // don't leave the button focused, or Space would re-toggle it
});

/* ---------------- game state ---------------- */
let started=false;
function startGame(){
  if(started) return;
  started=true;
  document.getElementById('title').classList.add('gone');
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
}
document.getElementById('title').addEventListener('click',startGame);

let dist=0, speed=0, lateral=0, heading=0, steerVis=0, shake=0, boostVis=0;
let boostFuel=BOOST_CAP, boostLock=false;
const boostEl=document.getElementById('boost'), boostFillEl=document.getElementById('boostFill');
const fareEl=document.getElementById('fare');
const speedEl=document.getElementById('speed');
const offroadEl=document.getElementById('offroad');

/* ---------------- main loop ---------------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05); last=now;
  const t=now/1000;

  tickTheme(now);

  // --- input ---
  let steer=(keys['ArrowRight']||keys['KeyD']?1:0)-(keys['ArrowLeft']||keys['KeyA']?1:0);
  if(touchSteer) steer=touchSteer;
  const accel=keys['ArrowUp']||keys['KeyW']||touchAccel;
  const brake=keys['ArrowDown']||keys['KeyS'];
  // --- boost fuel: one committed tank. Letting go does NOT top it up — the
  // charge only recharges once it has been run all the way to empty, and then
  // it has to come back to full before you can light it again. ---
  const wantBoost = started && !brake && (keys['ShiftLeft']||keys['ShiftRight']);
  let boost=false;
  if(boostLock){                                   // burnt out: refilling, no boost available
    boostFuel=Math.min(BOOST_CAP, boostFuel+boostRegen()*dt);
    if(boostFuel>=BOOST_CAP){ boostFuel=BOOST_CAP; boostLock=false; }
  }else if(wantBoost && boostFuel>0){
    boost=true;
    boostFuel-=boostDrain()*dt;
    if(boostFuel<=0){ boostFuel=0; boostLock=true; }
  }                                                // otherwise the tank just holds its level
  boostFillEl.style.width=(boostFuel/BOOST_CAP*100).toFixed(1)+'%';
  boostEl.classList.toggle('lock', boostLock);
  boostEl.classList.toggle('low', !boostLock && boostFuel<BOOST_CAP*0.3);

  // which tunnel are we in / heading for, and are the walls around us?
  const tunWin = zoneWindow(dist-60, Z_TUN);
  const inTunnel = (dist+8) > tunWin[0]+3 && (dist+8) < tunWin[1]-3;
  const inCity = zoneOf(dist+8)===Z_CITY;    // kerbs box the lane in

  // --- speed (tops and acceleration scale with garage upgrades) ---
  const target= !started? 55 : brake? 25 : boost? boostTop() : accel? engineTop() : cruiseTop();
  const rate = target>speed? (boost? accelRate()+40 : accel? accelRate() : 35) : 130;
  speed += Math.sign(target-speed)*Math.min(Math.abs(target-speed), rate*dt);
  boostVis += ((boost?1:0) - boostVis)*Math.min(1, dt*9);
  if(started) tickEconomy(dt, speed);

  // --- steering (yaw first, then travel along the heading) ---
  // steerVis : smoothed wheel position (-1..1)
  // heading  : the car's yaw relative to the road; the car moves the way its
  //            nose points, so left/right turns the car instead of sliding it.
  // lateral  : resulting offset from the road centre (metres)
  steerVis += (steer-steerVis)*Math.min(1,dt*7);
  const sCar = dist + 8;
  const rx = roadX(sCar);
  const MAX_YAW = 0.34;                        // heading vs road at full lock
  if(started){
    heading += (steerVis*MAX_YAW - heading)*Math.min(1,dt*6);
    lateral += Math.sin(heading)*(16 + speed*0.7)*dt;
  }else{
    heading += (0-heading)*Math.min(1,dt*3);
    lateral += (0-lateral)*Math.min(1,dt*2);
    steerVis *= Math.max(0,1-dt*2);
  }
  // tunnel walls and city kerbs are solid; out in the open there's slack past the edge
  const LIMIT = inTunnel ? TUN_W-2.7 : inCity ? HALF : HALF+4;
  lateral = Math.max(-LIMIT, Math.min(LIMIT, lateral));

  // --- off-road ---
  const off = Math.abs(lateral) > HALF-1.2;
  if(off && started){
    speed=Math.max(35, speed - 90*dt);
    shake=Math.min(1, shake+dt*6);
  }else shake=Math.max(0,shake-dt*4);
  offroadEl.style.opacity = off&&started? 1:0;

  // scraping a tunnel wall or clipping a kerb
  if((inTunnel||inCity) && started && Math.abs(lateral) > LIMIT-0.15){
    speed=Math.max(30, speed - 170*dt);
    shake=Math.min(1, shake+dt*9);
    heading *= Math.max(0, 1-dt*6);
  }

  // --- advance world ---
  dist += speed*dt;
  updateRibbons(dist);
  gridTex.offset.y = dist/GRID_CELL;

  // --- environment: mountains -> tunnel -> city -> loop ---
  updateTunnel(dist, tunWin);
  const tf = tunFactor(dist, tunWin);        // 1 only while the camera is inside
  const cd = cityDepth(dist);                // the city opens the view right up
  scene.fog.near = (250 + 120*cd)*(1-tf) + 45*tf;
  scene.fog.far  = (FAR_HIDE + 800*cd)*(1-tf) + 400*tf;
  updateCity(dist, scene.fog.far);
  updateCityFurniture(dist, scene.fog.far);
  updateRides(dist, scene.fog.far, t);
  groundMat.color.setScalar(1 - 0.6*cd);     // neon void gives way to pavement
  scene.fog.color.copy(baseFogColor).lerp(BLACKC, tf*0.7);
  sunLight.intensity = SUN_BASE*(1 - 0.8*tf);
  ambLight.intensity = 1 - 0.5*tf;
  sunMesh.material.opacity = 1-tf;
  sunGlow.material.opacity = 1-tf;
  ridges.forEach(r=>{ r.mat.opacity = 1-tf; if(r.line) r.line.opacity = (1-tf)*0.55; });

  // --- props (mountain scenery) ---
  for(const p of props){
    let z = dist - p.s;
    if(z > 28){
      recycleProp(p);
      if(p.offset!==0){
        const side=Math.random()<.5?-1:1;
        const far=Math.abs(p.offset)>60;
        p.offset = side*(far? 70+Math.random()*110 : HALF+7+Math.random()*24);
      }
      placeProp(p);
      z = dist - p.s;
    }
    p.mesh.position.z = z;
    p.mesh.visible = (p.s - dist) < FAR_HIDE;
  }

  // --- hop + kickflip ---
  if(airborne){
    jumpVY -= GRAV*dt; jumpY += jumpVY*dt;
    if(jumpY<=0){                                  // touchdown
      const impact=-jumpVY;
      jumpY=0; jumpVY=0; airborne=false;
      flipping=false; flipT=0; flipAngle=0;        // flip is guaranteed finished (it only starts if it fits)
      landAge=0; landMag=Math.min(0.4, impact*0.015);
    }
  }
  if(flipping){
    flipT += dt/FLIP_DUR;
    if(flipT>=1){ flipping=false; flipT=0; flipAngle=0; }   // lands exactly on a full turn -> seamless
    else flipAngle = flipDir*Math.PI*2*easeInOut(flipT);
  }
  landAge += dt;
  // damped-spring squash on landing: starts at 0, dips, settles (no snap)
  const landBounce = landAge<0.7 ? -landMag*Math.exp(-landAge*9)*Math.sin(landAge*20) : 0;

  // --- car (fixed on screen, actually turns) ---
  const roadDir = (roadX(sCar+3) - roadX(sCar-3)) / 6;   // road tangent, dx/ds
  car.position.x = rx + lateral;
  car.position.y = .15 + Math.sin(t*9)*.05 + jumpY + landBounce + (off&&!airborne? (Math.random()-.5)*.3*shake :0);
  // face down the road, then add the actual steering yaw; both are 0 when
  // you're not steering on a straight, so the car sits dead ahead.
  car.rotation.y = -roadDir - heading;
  car.rotation.z = -heading*0.5 - steerVis*0.04 + flipAngle;   // bank into the turn, + kickflip roll
  const pitchTarget = (accel? -.025 : brake? .05 : 0) + (airborne? jumpVY*0.011 : 0) + landBounce*0.5;
  pitch += (pitchTarget - pitch)*Math.min(1, dt*10);          // smoothed so nothing snaps on landing
  car.rotation.x = pitch;
  car.userData.frontWheels.forEach(w=> w.rotation.y = steerVis*0.42);
  car.userData.wheelSpin.forEach(s=> s.rotation.x = (-dist*0.9)%(Math.PI*2));
  const tg=car.userData.tailGlow;
  tg.material.opacity = brake? 1 : .45+speed/500;
  tg.scale.setScalar(brake? 1.4 : 1);

  // --- boost flames ---
  {
    const on=boostVis, lit=on>=0.03, flick=0.7+Math.random()*0.6;
    vFlameO.opacity = on*0.5*flick;          // shared across every body
    vFlameI.opacity = on*0.85*flick;
    for(const fl of car.userData.flames){
      fl.outer.visible=fl.inner.visible=lit;
      if(!lit) continue;
      fl.outer.scale.set(0.8+0.3*flick, on*(0.85+0.4*flick), 0.8+0.3*flick);
      fl.inner.scale.set(0.8+0.3*flick, on*(0.9+0.3*flick), 0.8+0.3*flick);
    }
  }
  if(car.userData.rig.extraLean)             // bikes lean further than the chassis does
    VEHICLES[game.vehicle].g.rotation.z = -steerVis*car.userData.rig.extraLean;

  // --- camera: locked directly behind the car; the road curves ahead ---
  // camera x carries the same `lateral` as the car, so the car holds a fixed
  // horizontal spot on screen while the road edges slide past it.
  const camCenterX = roadX(dist-10);
  const aheadX = roadX(sCar+120);
  camera.position.x = camCenterX + lateral;
  camera.position.y = 7 + Math.sin(t*2.2)*.12;
  camera.position.z = 10;
  if(shake>0){
    camera.position.x += (Math.random()-.5)*shake*.6;
    camera.position.y += (Math.random()-.5)*shake*.5;
  }
  camera.lookAt((rx+lateral)*0.35 + (aheadX+lateral)*0.65, 4, -80);
  camera.rotateZ(-steerVis*.03);
  const fov = Math.min(104, 68 + speed*.085);   // capped, or upgraded top speeds fish-eye
  if(Math.abs(camera.fov-fov)>.1){ camera.fov=fov; camera.updateProjectionMatrix(); }

  // --- sky tracks camera (infinite distance illusion) ---
  skyGroup.position.x = camera.position.x;

  // --- HUD ---
  speedEl.firstChild.textContent = Math.round(speed*1.6)+' ';

  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
